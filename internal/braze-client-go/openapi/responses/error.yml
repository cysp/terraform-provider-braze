ErrorResponse:
  description: Error response
  content:
    application/json:
      schema:
        type: object
        required:
          - message
        properties:
          message:
            type: string
            description: Error message describing what went wrong
          errors:
            type: array
            items: {}
            description: Endpoint-specific error details. Template endpoints return strings; catalog endpoints return objects with id, message, parameters, and parameter_values.
